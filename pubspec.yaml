name: whatsapp
description: Local-first WhatsApp client with offline SQLite storage
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  whatsapp_bot_flutter_mobile: ^2.1.2
  whatsapp_bot_platform_interface: ^2.0.2
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  file_picker: ^10.3.10
  record: ^7.1.1
  audioplayers: ^6.1.0
  open_filex: ^4.7.0
  flutter_local_notifications: ^19.4.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
